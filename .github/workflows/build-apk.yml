name: Build APK

# Builds Snapshots.apk at GitHub.
#   - Every push to main: the APK is attached to the run (Actions tab > the run > Artifacts).
#   - Push a tag like v0.1.0: the APK is also published on the repository's Releases page.
#
# The APK is signed with the key in the repository's secrets, so each new APK installs over the
# last one. Secrets (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64   the keystore file, base64-encoded
#   ANDROID_KEYSTORE_PASSWORD its password (also used for the key)
#   ANDROID_KEY_ALIAS         the key's alias (snapshots)
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # lets the last step attach the APK to a release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'   # the version the app is tested with; raise it on purpose, not by accident
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE" ] && [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "::error::No signing key in the repository secrets. A release APK signed with a throwaway key would not install over the last one, so this build stops here. Add the three ANDROID_KEY* secrets (see the top of this file) and run it again."
            exit 1
          fi
          if [ -z "$KEYSTORE" ]; then
            echo "::warning::No signing key in the repository secrets. This APK is signed with a throwaway key and won't install over an earlier one."
            echo "SNAPSHOTS_DEBUG_SIGNING=1" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "$KEYSTORE" | base64 -d > android/upload-keystore.jks
          {
            echo "storeFile=../upload-keystore.jks"
            echo "storePassword=$PASSWORD"
            echo "keyAlias=$ALIAS"
            echo "keyPassword=$PASSWORD"
          } > android/key.properties

      - name: Build release APK
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            flutter build apk --release --build-name "$VERSION" --build-number "${{ github.run_number }}"
          else
            flutter build apk --release --build-number "${{ github.run_number }}"
          fi
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Snapshots.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Snapshots-apk
          path: build/app/outputs/flutter-apk/Snapshots.apk
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/Snapshots.apk
