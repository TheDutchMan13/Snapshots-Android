name: snapshots_app
description: "Snapshots for Android: back up your phone and browse your Snapshots photo library."
publish_to: 'none'
version: 0.2.0+4

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cached_network_image: ^4.0.6
  connectivity_plus: ^7.3.2
  crypto: ^3.0.8
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  intl: ^0.20.3
  path: ^1.9.1
  path_provider: ^2.1.6
  photo_manager: ^3.12.0
  photo_view: ^0.15.0
  provider: ^6.1.5
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  sqflite: ^2.4.5
  video_player: ^2.14.1
  workmanager: ^0.10.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Tests only, and already part of shared_preferences: an in-memory stand-in for the phone's settings store.
  shared_preferences_platform_interface: ^2.4.0

flutter:
  uses-material-design: true
